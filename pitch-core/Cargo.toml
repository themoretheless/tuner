[package]
name = "pitch-core"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
rustfft = "6.1"
num-complex = "0.4"

[features]
default = []
wasm = ["wasm-bindgen"]

[dev-dependencies]
approx = "0.5"
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

name: Build Web

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read and validate version
        id: metadata
        run: node scripts/release-metadata.mjs validate

      - name: Setup Vue
        uses: themoretheless/.github/.github/actions/setup-vue@d66cd190a0d7a8b45f909dfa97597be34ec93f1f # first-party actions
        with:
          node-version-file: .nvmrc
          npm-cache-dependency-path: web/package-lock.json
          working-directory: web

      - name: Setup Rust
        uses: themoretheless/.github/.github/actions/setup-rust@d66cd190a0d7a8b45f909dfa97597be34ec93f1f # first-party actions
        with:
          rust-toolchain: beta
          targets: wasm32-unknown-unknown
          tools: wasm-pack@0.15.0
          cache-key: web-wasm

      - name: Run web tests
        working-directory: web
        run: npm test

      - name: Install Playwright browser
        working-directory: web
        run: npm run test:e2e:install

      - name: Run browser tests
        working-directory: web
        run: npm run test:e2e

      - name: Build Vue
        working-directory: web
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ steps.metadata.outputs.version }}
          VITE_APP_SHA: ${{ inputs.ref || github.sha }}

      - name: Zero-network gate
        run: node scripts/check-no-network.mjs

      - name: SPA fallback for GitHub Pages
        run: cp web/dist/index.html web/dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

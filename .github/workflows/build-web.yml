name: Build Web

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read and validate version
        id: metadata
        shell: bash
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');

          const expected = JSON.parse(readFileSync('version.json', 'utf8')).version;
          const jsonFiles = [
            'web/package.json',
            'desktop/package.json',
            'desktop/src-tauri/tauri.conf.json',
          ];
          const cargoFiles = [
            'Cargo.toml',
          ];

          for (const file of jsonFiles) {
            const actual = JSON.parse(readFileSync(file, 'utf8')).version;
            if (actual !== expected) throw new Error(`${file}: expected ${expected}, got ${actual}`);
          }
          for (const file of cargoFiles) {
            const match = readFileSync(file, 'utf8').match(/^version = "([^"]+)"$/m);
            if (!match || match[1] !== expected) {
              throw new Error(`${file}: workspace version must be ${expected}`);
            }
          }
          if (!/^\d+\.\d+\.\d+$/.test(expected)) throw new Error(`invalid release version: ${expected}`);
          require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `version=${expected}\n`);
          NODE

      - name: Check version
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          VERSION=$(node -p 'require("./version.json").version')
          LATEST=$(git tag --sort=-v:refname | grep '^v[0-9]' | head -1 | sed 's/^v//' || echo "0.0.0")

          # Check if code files changed (not just CI/docs)
          CODE_CHANGED=$(git diff --name-only origin/main...HEAD \
            | grep -v '^\.github/' \
            | grep -v '^\.vscode/' \
            | grep -v '^\.zed/' \
            | grep -v '^\.claude/' \
            | grep -v '^\.gitignore' \
            | grep -v '^README' \
            | grep -v '^LICENSE' \
            | grep -v '^CHANGELOG' \
            | grep -v '^\.env' \
            | grep -v '\.md$' \
            || true)

          if [ -n "$CODE_CHANGED" ]; then
            if git tag -l "v${VERSION}" | grep -q .; then
              echo "::error::v${VERSION} already released. Bump version.json."
              exit 1
            fi
            if [ "$(printf '%s\n' "$LATEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
              echo "::error::v${VERSION} is less than latest release v${LATEST}. Version must be higher."
              exit 1
            fi
            echo "New version v${VERSION} (latest: v${LATEST})"
          else
            echo "No code changes, version bump not required"
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Rust
        uses: themoretheless/.github/.github/actions/setup-rust@bb3377f2f424201379ab4e47e147f164f4014b38 # v1
        with:
          targets: wasm32-unknown-unknown


      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Check generated note math
        working-directory: web
        run: npm run codegen:check

      - name: Typecheck frontend
        working-directory: web
        run: npx vue-tsc --noEmit

      - name: Run web tests
        working-directory: web
        run: npm test

      - name: Install Playwright browser
        working-directory: web
        run: npm run test:e2e:install

      - name: Run browser tests
        working-directory: web
        run: npm run test:e2e

      - name: Build Vue
        working-directory: web
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ steps.metadata.outputs.version }}
          VITE_APP_SHA: ${{ inputs.ref || github.sha }}

      - name: SPA fallback for GitHub Pages
        run: cp web/dist/index.html web/dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

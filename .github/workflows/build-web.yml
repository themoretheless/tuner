name: Build Web

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read and validate version
        id: metadata
        run: node scripts/release-metadata.mjs validate

      - name: Setup Vue
        uses: themoretheless/.github/.github/actions/setup-vue@2d3bc163ca57318e89e801795a0b0356d5a9d941 # first-party actions
        with:
          node-version-file: .nvmrc
          npm-cache-dependency-path: web/package-lock.json
          working-directory: web

      - name: Setup Rust
        uses: themoretheless/.github/.github/actions/setup-rust@2d3bc163ca57318e89e801795a0b0356d5a9d941 # first-party actions
        with:
          rust-toolchain: beta
          targets: wasm32-unknown-unknown
          tools: wasm-pack@0.15.0
          cache-key: web-wasm

      - name: Run web tests
        working-directory: web
        run: npm test

      - name: Install Playwright browser
        working-directory: web
        run: npm run test:e2e:install

      - name: Run browser tests
        working-directory: web
        run: npm run test:e2e

      - name: Build Vue
        working-directory: web
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ steps.metadata.outputs.version }}
          VITE_APP_SHA: ${{ inputs.ref || github.sha }}

      - name: Zero-network gate
        run: node scripts/check-no-network.mjs

      - name: SPA fallback for GitHub Pages
        run: cp web/dist/index.html web/dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: web/dist

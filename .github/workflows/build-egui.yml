name: Build egui

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read and validate version
        id: metadata
        run: node scripts/release-metadata.mjs validate

      - name: Setup Rust
        uses: themoretheless/.github/.github/actions/setup-rust@d66cd190a0d7a8b45f909dfa97597be34ec93f1f # first-party actions
        with:
          rust-toolchain: beta
          targets: ${{ matrix.target }}
          cache-key: egui-${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Build egui
        run: |
          cargo build --locked --release -p guitar-tuner-egui \
            --target "${{ matrix.target }}"
        env:
          CARGO_INCREMENTAL: 0

      - name: Package unsigned native application
        id: package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          bash scripts/package-egui-release.sh package \
            --workspace "$PWD" \
            --runner-os "$RUNNER_OS" \
            --target "$TARGET" \
            --version "$VERSION" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify native release package
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          bash scripts/package-egui-release.sh verify \
            --workspace "$PWD" \
            --runner-os "$RUNNER_OS" \
            --version "$VERSION" \
            --package-name "$PACKAGE_NAME" \
            --package-path "$PACKAGE_PATH"

      - name: Upload egui artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: egui-${{ matrix.os }}-${{ matrix.target }}
          path: ${{ steps.package.outputs.path }}
          retention-days: 7
          if-no-files-found: error

name: Copilot Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    uses: themoretheless/.github/.github/workflows/copilot-review.yml@d66cd190a0d7a8b45f909dfa97597be34ec93f1f # first-party actions
    with:
      # Copilot always emits an overview body; gate only actionable inline comments.
      fail_on_comments: true

name: Security Gates

# Гейты зависимостей M8: cargo-deny и npm audit.
# Zero-network проверяется в build-web после production-сборки.
# Workflow вызывается из release.yml как обязательный гейт и гоняется на каждый PR.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read

jobs:
  # 1. cargo-deny: лицензии, advisories (RustSec), bans, sources. deny.toml в корне.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Rust
        uses: themoretheless/.github/.github/actions/setup-rust@0e1f87dda0310901d9db8c0cb0b21b640fc4d85a # v1
        with:
          rust-toolchain: beta
          tools: cargo-deny

      - name: cargo deny check
        run: cargo deny check

  # 2. npm audit для web/ (severity high и выше).
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Vue
        uses: themoretheless/.github/.github/actions/setup-vue@0e1f87dda0310901d9db8c0cb0b21b640fc4d85a # v1
        with:
          node-version-file: .nvmrc
          npm-cache-dependency-path: web/package-lock.json
          working-directory: web

      - name: npm audit (web)
        working-directory: web
        # high+ = падение. Известные исключения фиксируются ТОЛЬКО через
        # overrides в package.json с комментарием, не через --audit-level=none.
        run: npm audit --audit-level=high

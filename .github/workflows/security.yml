name: Security Gates

# Релизные гейты M8: zero-network, cargo-deny и npm audit.
# Вызывается из release.yml как обязательный гейт релиза и гоняется на каждый PR.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read

jobs:
  # 1. Zero-network proof: собираем прод-фронтенд и статически доказываем,
  #    что ни артефакт, ни исходники, ни прод-CSP, ни Rust-часть не содержат
  #    сетевых вызовов наружу. См. scripts/check-no-network.mjs.
  zero-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Vue
        uses: themoretheless/.github/.github/actions/setup-vue@3117a6afb233141f7f2b7809ed8b0866f3a29e28 # v1
        with:
          node-version: "22"
          npm-cache-dependency-path: web/package-lock.json
          working-directory: web

      - name: Setup Rust
        uses: themoretheless/.github/.github/actions/setup-rust@3117a6afb233141f7f2b7809ed8b0866f3a29e28 # v1
        with:
          rust-toolchain: beta
          targets: wasm32-unknown-unknown
          tools: wasm-pack@0.15.0
          cargo-workspaces: ". -> target"

      - name: Build web (production)
        working-directory: web
        run: npm run build

      - name: Zero-network gate
        run: node scripts/check-no-network.mjs

  # 2. cargo-deny: лицензии, advisories (RustSec), bans, sources. deny.toml в корне.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Rust
        uses: themoretheless/.github/.github/actions/setup-rust@3117a6afb233141f7f2b7809ed8b0866f3a29e28 # v1
        with:
          rust-toolchain: beta
          tools: cargo-deny
          cargo-workspaces: ". -> target"

      - name: cargo deny check
        run: cargo deny check

  # 3. npm audit для web/ (severity high и выше).
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Vue
        uses: themoretheless/.github/.github/actions/setup-vue@3117a6afb233141f7f2b7809ed8b0866f3a29e28 # v1
        with:
          node-version: "22"
          npm-cache-dependency-path: web/package-lock.json
          working-directory: web

      - name: npm audit (web)
        working-directory: web
        # high+ = падение. Известные исключения фиксируются ТОЛЬКО через
        # overrides в package.json с комментарием, не через --audit-level=none.
        run: npm audit --audit-level=high

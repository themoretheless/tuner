name: Security Gates

# Релизные гейты M8: zero-network, cargo-deny, npm audit, signing scaffold.
# Вызывается из release.yml как обязательный гейт релиза и гоняется на каждый PR.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read

jobs:
  # 1. Zero-network proof: собираем прод-фронтенд и статически доказываем,
  #    что ни артефакт, ни исходники, ни прод-CSP, ни Rust-часть не содержат
  #    сетевых вызовов наружу. См. scripts/check-no-network.mjs.
  zero-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build web (production, tauri base)
        working-directory: web
        run: npm run build:tauri

      - name: Zero-network gate
        run: node scripts/check-no-network.mjs

  # 2. cargo-deny: лицензии, advisories (RustSec), bans, sources. deny.toml в корне.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri"

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check

  # 3. npm audit для web/ и desktop/ (severity high и выше).
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Install dependencies (web)
        working-directory: web
        run: npm ci

      - name: npm audit (web)
        working-directory: web
        # high+ = падение. Известные исключения фиксируются ТОЛЬКО через
        # overrides в package.json с комментарием, не через --audit-level=none.
        run: npm audit --audit-level=high

      - name: Install dependencies (desktop)
        working-directory: desktop
        run: npm ci

      - name: npm audit (desktop)
        working-directory: desktop
        run: npm audit --audit-level=high

  # 4. Signing scaffold: plist/entitlements на месте, права минимальны,
  #    секреты подписи не закоммичены, RELEASE-SIGNING.md существует.
  release-signing-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Release-signing scaffold gate
        run: node scripts/check-release-signing.mjs

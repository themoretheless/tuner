name: Release
run-name: "Release v${{ inputs.version }}"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact repository version to release (for example, 0.1.14)"
        required: true
        type: string
      prerelease:
        description: "Create as pre-release"
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read and validate version
        id: metadata
        run: node scripts/release-metadata.mjs validate

      - name: Validate release request
        env:
          ACTUAL_VERSION: ${{ steps.metadata.outputs.version }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases must run from main, got $GITHUB_REF."
            exit 1
          fi
          if [ "$REQUESTED_VERSION" != "$ACTUAL_VERSION" ]; then
            echo "::error::Requested version $REQUESTED_VERSION does not match repository version $ACTUAL_VERSION."
            exit 1
          fi

  security:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ github.sha }}

  build-web:
    needs: [prepare, security]
    permissions:
      contents: read
    uses: ./.github/workflows/build-web.yml
    with:
      ref: ${{ github.sha }}

  build-egui:
    needs: [prepare, security]
    permissions:
      contents: read
    uses: ./.github/workflows/build-egui.yml
    with:
      ref: ${{ github.sha }}

  release:
    needs: [prepare, build-web, build-egui]

    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Get version
        id: version
        run: >-
          node scripts/release-metadata.mjs release
          --prerelease "${{ inputs.prerelease }}"

      - name: Download web artifact
        if: steps.version.outputs.skip != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          path: _site

      - name: Prepare web release archive
        if: steps.version.outputs.skip != 'true'
        run: mv _site/artifact.tar "guitar-tuner-web-${{ steps.version.outputs.tag }}.tar"

      - name: Download egui artifacts
        if: steps.version.outputs.skip != 'true' && needs.build-egui.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: egui-*
          path: egui-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        uses: themoretheless/.github/.github/actions/create-github-release@d66cd190a0d7a8b45f909dfa97597be34ec93f1f # first-party actions
        with:
          tag: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.is_pre == 'true' }}
          tag-exists: false
          github-token: ${{ github.token }}
          release-name: Release ${{ steps.version.outputs.tag }}
          files: |
            guitar-tuner-web-${{ steps.version.outputs.tag }}.tar
            egui-artifacts/**/*
          fail-on-unmatched-files: true

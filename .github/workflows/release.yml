name: Release
run-name: "Release: ${{ github.event.head_commit.message || github.ref_name }}"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Create as pre-release"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  security:
    uses: ./.github/workflows/security.yml

  build-web:
    needs: security
    uses: ./.github/workflows/build-web.yml

  build-egui:
    needs: security
    uses: ./.github/workflows/build-egui.yml

  pages-deploy:
    needs: build-web
    permissions:
      pages: write
      id-token: write
    uses: themoretheless/.github/.github/workflows/deploy-github-pages.yml@2d3bc163ca57318e89e801795a0b0356d5a9d941 # first-party actions

  release:
    needs: [build-web, build-egui]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: >-
          node scripts/release-metadata.mjs release
          --prerelease "${{ inputs.prerelease || 'false' }}"

      - name: Download web artifact
        if: steps.version.outputs.skip != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          path: _site

      - name: Prepare web release archive
        if: steps.version.outputs.skip != 'true'
        run: mv _site/artifact.tar "guitar-tuner-web-${{ steps.version.outputs.tag }}.tar"

      - name: Download egui artifacts
        if: steps.version.outputs.skip != 'true' && needs.build-egui.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: egui-*
          path: egui-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        uses: themoretheless/.github/.github/actions/create-github-release@2d3bc163ca57318e89e801795a0b0356d5a9d941 # first-party actions
        with:
          tag: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.is_pre == 'true' }}
          tag-exists: false
          github-token: ${{ github.token }}
          release-name: Release ${{ steps.version.outputs.tag }}
          files: |
            guitar-tuner-web-${{ steps.version.outputs.tag }}.tar
            egui-artifacts/**/*
          fail-on-unmatched-files: true

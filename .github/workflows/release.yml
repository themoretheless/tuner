name: Release
run-name: "Release: ${{ github.event.head_commit.message || github.ref_name }}"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Create as pre-release"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  test-core:
    permissions:
      contents: read
    uses: ./.github/workflows/test-core.yml

  metadata:
    needs: test-core
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release version
        id: version
        env:
          PRERELEASE: ${{ inputs.prerelease || 'false' }}
        shell: bash
        run: |
          VERSION=$(node -p 'require("./version.json").version')
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version.json must contain a stable semantic version."
            exit 1
          fi

          if [ "$PRERELEASE" = "true" ]; then
            TAG="v${VERSION}-rc.${GITHUB_RUN_NUMBER}"
          else
            TAG="v${VERSION}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            TAG_COMMIT=$(git rev-parse "${TAG}^{commit}")
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already points to $TAG_COMMIT, not $GITHUB_SHA. Bump version.json before releasing this commit."
              exit 1
            fi
            echo "$TAG already targets this commit; the release/assets will be reconciled idempotently."
          fi

  build-web:
    needs: test-core
    permissions:
      contents: read
    uses: ./.github/workflows/build-web.yml

  build-tauri:
    needs: test-core
    permissions:
      contents: read
    uses: ./.github/workflows/build-tauri.yml

  build-egui:
    needs: test-core
    permissions:
      contents: read
    uses: ./.github/workflows/build-egui.yml

  verify-release:
    needs: [metadata, build-web, build-tauri, build-egui]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download web archive
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: _site

      - name: Download Tauri packages
        uses: actions/download-artifact@v8
        with:
          pattern: tauri-*
          path: release-assets
          merge-multiple: true

      - name: Download egui binaries
        uses: actions/download-artifact@v8
        with:
          pattern: egui-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete release payload
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
        shell: bash
        run: |
          mv _site/artifact.tar "release-assets/guitar-tuner-web-${TAG}.tar"
          test -s "release-assets/guitar-tuner-web-${TAG}.tar"
          ASSET_COUNT=$(find release-assets -type f | wc -l | tr -d ' ')
          if [ "$ASSET_COUNT" -lt 10 ]; then
            echo "::error::Expected at least 10 release assets, found $ASSET_COUNT."
            find release-assets -type f -print
            exit 1
          fi
          find release-assets -type f -print

      - name: Upload verified release payload
        uses: actions/upload-artifact@v4
        with:
          name: release-payload
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  pages-deploy:
    needs: [metadata, build-web, build-tauri, build-egui, verify-release]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy production Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    needs: [metadata, verify-release, pages-deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release payload
        uses: actions/download-artifact@v8
        with:
          name: release-payload
          path: release-assets

      # softprops creates the tag only after every build, test and payload check
      # above succeeds; there is no separately pushed, orphanable tag step.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ needs.metadata.outputs.tag }}
          prerelease: ${{ needs.metadata.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: release-assets/**/*

name: Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (latest release when empty)"
        required: false
        type: string

permissions: {}

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  release-site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      found: ${{ steps.resolve.outputs.found }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve release archive
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          TAG="$REQUESTED_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          elif ! gh release view "$TAG" >/dev/null; then
            echo "::error::Release $TAG does not exist."
            exit 1
          fi

          echo "ref=${TAG:-${GITHUB_SHA}}" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ] && gh release download "$TAG" --pattern "guitar-tuner-web-${TAG}.tar"; then
            mkdir -p _site
            tar -xf "guitar-tuner-web-${TAG}.tar" -C _site
            test -s _site/index.html
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No compatible web archive found; source will be built instead."
          fi

      - name: Upload release site
        if: steps.resolve.outputs.found == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  build:
    needs: release-site
    if: needs.release-site.outputs.found != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build-web.yml
    with:
      ref: ${{ needs.release-site.outputs.ref }}

  deploy:
    needs: [release-site, build]
    if: >-
      always() &&
      (needs.release-site.result == 'success' || needs.build.result == 'success') &&
      (needs.release-site.outputs.found == 'true' || needs.build.result == 'success')
    permissions:
      pages: write
      id-token: write
    uses: themoretheless/.github/.github/workflows/deploy-github-pages.yml@2d3bc163ca57318e89e801795a0b0356d5a9d941 # first-party actions

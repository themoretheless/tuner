name: Test pitch-core

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Rust
        uses: themoretheless/.github/.github/actions/setup-rust@0e1f87dda0310901d9db8c0cb0b21b640fc4d85a # v1
        with:
          rust-toolchain: beta
          components: rustfmt,clippy
          targets: wasm32-unknown-unknown

      # pitch-core depends only on rustfft (no cpal/ALSA), so -p keeps the
      # workspace's native-audio members out of the build.
      - name: Check Rust formatting
        run: cargo fmt --check -p pitch-core

      - name: Lint pitch-core
        run: cargo clippy -p pitch-core --all-targets --all-features -- -D warnings
        env:
          CARGO_INCREMENTAL: 0

      - name: Test pitch-core
        run: cargo test -p pitch-core --all-features
        env:
          CARGO_INCREMENTAL: 0

      - name: Gate real-instrument pitch quality
        run: >-
          cargo run --release -p pitch-core --example quality --
          --check --corpus fixtures/corpus/manifest.json
          > pitch-quality-report.json
        env:
          CARGO_INCREMENTAL: 0

      # Differential gate: the --check above only enforces absolute thresholds,
      # so degradation within the threshold would pass silently. Compare the
      # fresh report against fixtures/quality-baseline.json; refresh the
      # baseline intentionally via scripts/compare-quality-baseline.mjs --update.
      - name: Differential pitch quality gate
        run: node scripts/compare-quality-baseline.mjs --report pitch-quality-report.json

      - name: Upload pitch quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitch-quality-report
          path: pitch-quality-report.json
          if-no-files-found: error

      - name: Check pitch-core wasm feature
        run: cargo check -p pitch-core --target wasm32-unknown-unknown --features wasm
        env:
          CARGO_INCREMENTAL: 0
